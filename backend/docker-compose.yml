services:
  redis:
    image: redis
    ports:
      - "6379:6379"

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    env_file:
      - ./services/auth/.env
    environment:
      REDIS_URL: redis://redis:6379
    ports:
      - "8001:8001"
    depends_on:
      - redis

  chat:
    build:
      context: .
      dockerfile: services/chat/Dockerfile
    env_file:
      - ./services/chat/.env
    environment:
      REDIS_URL: redis://redis:6379
    ports:
      - "8002:8002"
    depends_on:
      - redis

  billing:
    build:
      context: .
      dockerfile: services/billing/Dockerfile
    env_file:
      - ./services/billing/.env
    environment:
      REDIS_URL: redis://redis:6379
    ports:
      - "8004:8004"
    depends_on:
      - redis

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    env_file:
      - ./gateway/.env
    ports:
      - "8000:8000"
    depends_on:
      - auth
      - chat
      - billing
      - redis

  agent:
    build:
      context: .
      dockerfile: services/agent/Dockerfile
    env_file:
      - ./services/agent/.env
    environment:
      REDIS_URL: redis://redis:6379
    ports:
      - "8003:8003"
    depends_on:
      - redis
      - auth
      - chat
      - billing