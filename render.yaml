services:
  # ---------------- BACKEND ----------------
  - type: web
    name: cortex-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /
    envVars:
      - key: FRONTEND_URL
        sync: false

      - key: REDIS_URL
        sync: false

      - key: MONGODB_URL
        sync: false

      # Internal services
      - key: AUTH_SERVICE
        value: http://localhost:8001

      - key: CHAT_SERVICE
        value: http://localhost:8002

      - key: AGENT_SERVICE
        value: http://localhost:8003

      # Razorpay
      - key: RAZORPAY_KEY_ID
        sync: false

      - key: RAZORPAY_KEY_SECRET
        sync: false

      # Firebase Admin
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false

      # AI APIs
      - key: GOOGLE_API_KEY
        sync: false

      - key: GROQ_API_KEY
        sync: false

      - key: TAVILY_API_KEY
        sync: false

      # AWS S3
      - key: AWS_ACCESS_KEY_ID
        sync: false

      - key: AWS_SECRET_ACCESS_KEY
        sync: false

      - key: AWS_REGION
        sync: false

      - key: AWS_BUCKET_NAME
        sync: false

      # OpenRouter
      - key: OPENROUTER_API_KEY
        sync: false

      # Qdrant
      - key: QDRANT_URL
        sync: false

      - key: QDRANT_API_KEY
        sync: false
